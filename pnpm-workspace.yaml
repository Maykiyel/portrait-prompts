# pnpm settings, not a workspace definition. This is a single-package repo.
# npm and yarn ignore this file; it only configures pnpm, so do not delete it
# if you use pnpm. The same settings work in the "pnpm" key of package.json.
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - vite@8.3.3
